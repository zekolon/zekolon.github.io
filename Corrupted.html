<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="status-bar-container"></div>
    <script>
      // Dynamically load the shared status bar
      fetch('status-bar.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('status-bar-container').innerHTML = html;
        });
    </script>
    <div class="main-content" style="display: flex; flex-direction: column; align-items: center;">
      <p style="font-size: 1.3em; text-align: center; margin-bottom: 2em;"></p>
      <div style="margin-top: 20em; display: flex; justify-content: center;">
        <img id="corrupted-gif" src="https://www.bing.com/th/id/OGC.0a9a35e5d52e57066c1db00a642f5b9e?o=7&cb=ucfimg2&pid=1.7&rm=3&rurl=https%3a%2f%2fmedia.tenor.com%2fjKGgpsJFL8wAAAAM%2fbonzi-buddy-look-up.gif&ehk=pi2bd69I1qv%2bdflkhsBuVyfFtITac3cBYAilPZm4mC0%3d&ucfimg=1" alt="Corrupted GIF" style="max-width: 1000px; max-height: 10000px; border-radius: 12px; box-shadow: 0 4px 24px #000a;" />
      </div>
    </div>

    <script>
    </script>
  <!-- Music Player -->
  <div
    id="music-player"
    style="
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      background: #181818ee;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5em 1em;
      z-index: 9999;
      box-shadow: 0 -2px 12px #000a;
      font-family: inherit;
    "
  >
    <span
      id="song-title"
      style="
        margin-right: 1em;
        font-weight: bold;
        font-size: 1em;
        letter-spacing: 1px;
      "
      >Leeches and The Festering Orifice by Jay Tholen</span
    >
    <audio
      id="audio-player"
      data-filename="New Project (1).mp3"
      preload="auto"
      controls
      loop
      style="width: 300px"
    ></audio>
    <div id="audio-controls-extra" style="margin-left:1em; color:#ddd; font-size:0.9em; display:flex; gap:0.5em; align-items:center;">
      <span id="audio-status">Waiting to load...</span>
      <button id="audio-retry" style="display:none;">Retry</button>
    </div>
  </div>
  <script>
    // Robust audio loading with encoding, status, and retry
    (function() {
      const audio = document.getElementById('audio-player');
      const status = document.getElementById('audio-status');
      const retryBtn = document.getElementById('audio-retry');
      if (!audio) return;

      const filename = audio.getAttribute('data-filename');
      const path = 'assets/' + filename;
      const encoded = encodeURI(path);

      function setStatus(text, isError) {
        status.textContent = text;
        status.style.color = isError ? '#ff8080' : '#ddd';
      }

      audio.preload = 'auto';
      audio.src = encoded;

      // Handlers
      audio.addEventListener('loadedmetadata', function() {
        setStatus('Loaded — ' + Math.round(audio.duration) + 's');
        audio.volume = 0.7;
      });
      audio.addEventListener('canplay', function() {
        setStatus('Ready to play');
      });
      audio.addEventListener('play', function() {
        setStatus('Playing');
      });
      audio.addEventListener('pause', function() {
        setStatus('Paused');
      });
      audio.addEventListener('error', function(e) {
        console.error('Audio failed to load', e);
        setStatus('Failed to load audio', true);
        retryBtn.style.display = 'inline-block';
      });

      retryBtn.addEventListener('click', function() {
        setStatus('Retrying...');
        retryBtn.style.display = 'none';
        // Force reload
        audio.src = '';
        // small timeout helps some browsers clear the failed state
        setTimeout(function() {
          audio.src = encoded;
          audio.load();
        }, 150);
      });

      // Try to load immediately, but avoid forcing autoplay — user can press play
      try {
        audio.load();
      } catch (err) {
        console.warn('audio.load() threw', err);
      }
    })();
  </script>
</html>
