    <!-- YouTube IFrame API + roulette logic -->
    <script>
  // We'll create YT.Player instances for each iframe so we can call playVideo()
  const videoCount = 5;
  const players = new Array(videoCount).fill(null);
      const iframeIds = [];
      for (let i = 0; i < videoCount; i++) iframeIds.push("yt-" + i);

      // Ensure each iframe has a valid origin and enablejsapi param before loading the API.
      (function fixIframeSrcs() {
        try {
          iframeIds.forEach((id) => {
            const iframe = document.getElementById(id);
            if (!iframe) return;
            try {
              const url = new URL(
                iframe.getAttribute("src"),
                window.location.href
              );
              // ensure enablejsapi=1
              if (!url.searchParams.get("enablejsapi"))
                url.searchParams.set("enablejsapi", "1");
              // set origin to current origin if missing or empty
              const originParam = url.searchParams.get("origin");
              if (!originParam)
                url.searchParams.set("origin", window.location.origin);
              iframe.setAttribute("src", url.toString());
            } catch (e) {
              // fallback: if URL parsing fails, append origin param naively
              let s = iframe.getAttribute("src") || "";
              if (s.indexOf("enablejsapi=1") === -1)
                s += (s.indexOf("?") === -1 ? "?" : "&") + "enablejsapi=1";
              if (s.indexOf("origin=") === -1)
                s += "&origin=" + encodeURIComponent(window.location.origin);
              iframe.setAttribute("src", s);
            }
          });
        } catch (e) {}
      })();

      // Load the IFrame Player API code asynchronously.
      var tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName("script")[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      function onYouTubeIframeAPIReady() {
        // initialize players
        iframeIds.forEach((id, idx) => {
          try {
            players[idx] = new YT.Player(id, {
              events: {
                onReady: function () {},
                onStateChange: function () {},
              },
            });
          } catch (e) {
            console.warn("YT player init failed for", id, e);
          }
        });
      }

      // Helper: get all video item elements (top grid + bottom grid)
      function getAllVideoItems() {
        const top = Array.from(document.querySelectorAll('#music-grid .music-item'));
        const bottom = Array.from(document.querySelectorAll('#music-grid-bottom .music-item'));
        return top.concat(bottom);
      }

      // Helper: highlight/unhighlight an item by global index
      function setHighlight(index, on) {
        const items = getAllVideoItems();
        const item = items[index];
        if (!item) return;
        let highlight = item.querySelector('.roulette-highlight');
        if (on) {
          if (!highlight) {
            highlight = document.createElement('div');
            highlight.className = 'roulette-highlight';
            item.appendChild(highlight);
          }
        } else {
          if (highlight) highlight.remove();
        }
      }

      // Roulette animation: cycles through items then picks finalIndex
      function runRoulette(finalIndex, cycles = 3) {
        return new Promise((resolve) => {
          const items = getAllVideoItems();
          if (!items || items.length === 0) {
            resolve(finalIndex);
            return;
          }
          const n = items.length;
          let order = [];
          // generate cycling order that lands on finalIndex after cycles
          for (let c = 0; c < cycles; c++) {
            for (let i = 0; i < n; i++) order.push(i);
          }
          // append a partial cycle leading to finalIndex
          const last = order.length ? order[order.length - 1] : -1;
          const extra = (finalIndex + n - last - 1) % n;
          for (let i = 0; i <= extra; i++) order.push((last + 1 + i) % n);

          let i = 0;
          let delay = 80; // start fast
          function step() {
            if (i > 0) setHighlight(order[i - 1], false);
            setHighlight(order[i], true);
            i++;
            if (i < order.length) {
              // slow down towards the end
              delay = Math.min(400, delay + (i / order.length) * 30);
              setTimeout(step, delay);
            } else {
              resolve(order[order.length - 1]);
            }
          }
          step();
        });
      }

      async function pickAndPlayRandom() {
        const btn = document.getElementById("randomize-btn");
        if (!btn) return;
        btn.disabled = true;

        const items = getAllVideoItems();
        const n = items ? items.length : 0;
        if (n === 0) {
          btn.disabled = false;
          return;
        }

        const finalIndex = Math.floor(Math.random() * n);
        await runRoulette(finalIndex, 4);

        // Try to play via YT API if ready, otherwise show a click overlay
        const player = players[finalIndex];
        if (player && typeof player.playVideo === "function") {
          try {
            player.playVideo();
          } catch (e) {
            console.warn("playVideo failed", e);
            promptPlay(finalIndex);
          }
        } else {
          // fallback: instruct user to click the iframe to play
          promptPlay(finalIndex);
        }

        // re-enable after a short delay
        setTimeout(() => {
          btn.disabled = false;
        }, 700);
      }

      // Pause all videos (YT players or raw iframes) and remove overlays/highlights
      function pauseAllVideos() {
        // pause via API if available
        for (let i = 0; i < players.length; i++) {
          const p = players[i];
          try {
            if (p && typeof p.pauseVideo === "function") {
              p.pauseVideo();
            }
          } catch (e) {
            console.warn("pauseVideo failed for player", i, e);
          }
          // fallback: postMessage command for YT iframe
          const iframe = document.getElementById("yt-" + i);
          if (iframe && iframe.contentWindow) {
            try {
              iframe.contentWindow.postMessage(
                JSON.stringify({
                  event: "command",
                  func: "pauseVideo",
                  args: [],
                }),
                "*"
              );
            } catch (e) {
              // ignore
            }
          }
        }

        // also pause bottom audio if present
        try {
          const a = document.getElementById("audio-player");
          if (a && !a.paused) a.pause();
        } catch (e) {}

        // remove click-to-play overlays and roulette highlights from all items
        const items = getAllVideoItems();
        if (items && items.length) {
          for (let i = 0; i < items.length; i++) {
            const item = items[i];
            const overlay = item.querySelector('div[style*="Click to play"]');
            // remove any .roulette-highlight nodes
            const highlight = item.querySelector(".roulette-highlight");
            if (highlight) highlight.remove();
            // remove overlays by classless detection (we appended overlays without a class)
            const overlays = Array.from(item.children).filter(
              (c) => c !== item.querySelector("iframe") && c !== highlight
            );
            overlays.forEach((o) => {
              if (o && o.innerText && /Click to play/i.test(o.innerText)) o.remove();
            });
          }
        }
      }

      function promptPlay(index) {
        const items = getAllVideoItems();
        if (!items || !items.length) return;
        const item = items[index];
        if (!item) return;
        // small overlay
        const overlay = document.createElement("div");
        overlay.style.position = "absolute";
        overlay.style.left = 0;
        overlay.style.top = 0;
        overlay.style.right = 0;
        overlay.style.bottom = 0;
        overlay.style.display = "flex";
        overlay.style.alignItems = "center";
        overlay.style.justifyContent = "center";
        overlay.style.background = "rgba(0,0,0,0.35)";
        overlay.style.color = "#fff";
        overlay.style.fontWeight = "700";
        overlay.style.cursor = "pointer";
        overlay.innerText = "Click to play";
        overlay.addEventListener("click", () => {
          const iframe = item.querySelector("iframe");
          if (iframe) {
            iframe.contentWindow.focus();
            // Try to simulate a user interaction by reloading the src (this will be a click-originated navigation)
            const src = iframe.getAttribute("src");
            iframe.setAttribute("src", src);
            overlay.remove();
          }
        });
        item.appendChild(overlay);
      }

      function anyVideoPlaying() {
        try {
          for (let i = 0; i < players.length; i++) {
            const p = players[i];
            if (
              p &&
              typeof p.getPlayerState === "function" &&
              typeof YT !== "undefined"
            ) {
              try {
                if (p.getPlayerState() === YT.PlayerState.PLAYING) return true;
              } catch (e) {}
            }
          }
        } catch (e) {}
        // also check bottom audio
        try {
          const a = document.getElementById("audio-player");
          if (a && !a.paused) return true;
        } catch (e) {}
        return false;
      }

      document.getElementById("randomize-btn").addEventListener("click", () => {
        // Always pause any currently playing media first, then run the roulette and play the chosen video.
        pauseAllVideos();
        // small delay to let pause messages take effect before playing the next one
        setTimeout(() => pickAndPlayRandom(), 150);
      });
    </script>
